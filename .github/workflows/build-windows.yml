name: Windows portable application build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and packager
        timeout-minutes: 7
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Check Python syntax
        timeout-minutes: 2
        run: python -m compileall -q crawler recon gui main.py

      - name: Stage Public Suffix List snapshot explicitly
        shell: pwsh
        run: |
          $packageDir = python -c "import pathlib, tldextract; print(pathlib.Path(tldextract.__file__).resolve().parent)"
          $snapshot = Join-Path $packageDir ".tld_set_snapshot"
          if (-not (Test-Path -LiteralPath $snapshot -PathType Leaf)) {
            throw "tldextract snapshot was not found at $snapshot"
          }
          New-Item -ItemType Directory -Force -Path "build-data/tldextract" | Out-Null
          Copy-Item -LiteralPath $snapshot -Destination "build-data/tldextract/.tld_set_snapshot" -Force
          if (-not (Test-Path -LiteralPath "build-data/tldextract/.tld_set_snapshot" -PathType Leaf)) {
            throw "Failed to stage the Public Suffix List snapshot."
          }

      - name: Build portable Windows application folder
        timeout-minutes: 12
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name ReconGUI
          --collect-submodules recon
          --collect-submodules crawler
          --collect-submodules gui
          --collect-submodules tldextract
          --add-data "build-data/tldextract/.tld_set_snapshot;tldextract"
          --add-data "wordlists/common.txt;wordlists"
          main.py

      - name: Verify executable, wordlist, and bundled public-suffix scope
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ReconGUI/ReconGUI.exe")) {
            throw "ReconGUI.exe was not generated."
          }
          if (-not (Get-ChildItem -Path "dist/ReconGUI" -Recurse -Filter "common.txt")) {
            throw "Bundled content-discovery wordlist was not included."
          }
          $suffixSnapshot = Get-ChildItem -Path "dist/ReconGUI" -Recurse -Force -File |
            Where-Object { $_.Name -eq ".tld_set_snapshot" } | Select-Object -First 1
          if (-not $suffixSnapshot) {
            throw "Bundled tldextract Public Suffix List snapshot was not included."
          }
          $scopeTest = Start-Process -FilePath "dist/ReconGUI/ReconGUI.exe" -ArgumentList "--self-test-domain-scope" -PassThru -Wait
          if ($scopeTest.ExitCode -ne 0) {
            throw "Bundled Public Suffix List test failed with exit code $($scopeTest.ExitCode)."
          }

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ReconGUI-Windows-${{ github.run_number }}
          path: dist/ReconGUI/
          if-no-files-found: error
          retention-days: 14
