name: Windows application build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies and packager
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build Windows application folder
        timeout-minutes: 8
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ReconGUI --add-data "wordlists/common.txt;wordlists" main.py

      - name: Verify executable and bundled wordlist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ReconGUI/ReconGUI.exe")) {
            throw "ReconGUI.exe was not generated."
          }
          if (-not (Get-ChildItem -Path "dist/ReconGUI" -Recurse -Filter "common.txt")) {
            throw "Bundled content-discovery wordlist was not included."
          }

      - name: Upload portable application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconGUI-Windows-\${{ github.ref_name }}
          path: dist/ReconGUI/
          if-no-files-found: error
          retention-days: 14
