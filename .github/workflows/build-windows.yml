name: Windows portable application build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and packager
        timeout-minutes: 7
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Check Python syntax
        timeout-minutes: 2
        run: python -m compileall -q crawler recon gui main.py

      - name: Build portable Windows application folder
        timeout-minutes: 12
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name ReconGUI
          --collect-submodules recon
          --collect-submodules crawler
          --collect-submodules gui
          --collect-all tldextract
          --add-data "wordlists/common.txt;wordlists"
          main.py

      - name: Verify executable and bundled wordlist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ReconGUI/ReconGUI.exe")) {
            throw "ReconGUI.exe was not generated."
          }
          if (-not (Get-ChildItem -Path "dist/ReconGUI" -Recurse -Filter "common.txt")) {
            throw "Bundled content-discovery wordlist was not included."
          }

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ReconGUI-Windows-${{ github.run_number }}
          path: dist/ReconGUI/
          if-no-files-found: error
          retention-days: 14
