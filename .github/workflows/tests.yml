name: tests

on:
  push:
  pull_request:

# Never let a broken async test occupy a runner for hours.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check aiohttp beautifulsoup4 lxml pytest pytest-timeout requests mmh3 tldextract
      - name: Check Python syntax
        timeout-minutes: 1
        run: python -m compileall -q crawler recon gui main.py
      - name: Run tests with per-test timeout
        timeout-minutes: 3
        run: python -m pytest -q --timeout=30 --durations=10
