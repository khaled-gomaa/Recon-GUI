name: tests

on:
  push:
  pull_request:

# Never let a broken async test occupy a runner for hours.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application and test dependencies
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest-timeout
      - name: Check Python syntax
        timeout-minutes: 1
        run: python -m compileall -q crawler recon gui main.py
      - name: Run tests with per-test timeout
        timeout-minutes: 4
        run: python -m pytest -q --timeout=30 --durations=10
