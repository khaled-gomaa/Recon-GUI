name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install aiohttp beautifulsoup4 lxml pytest requests mmh3
      - name: Check Python syntax
        run: python -m compileall -q crawler recon gui main.py
      - name: Run tests
        run: python -m pytest -q
